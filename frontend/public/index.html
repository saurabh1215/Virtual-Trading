<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Virtual Trading Playground - Stock Market Simulator" />

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

  <title>Virtual Trading Playground | Stock Simulator</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 75%);
    }

    .loading-container {
      text-align: center;
      color: #94a3b8;
    }

    .loading-text {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 600;
      color: #6366f1;
      margin-bottom: 20px;
    }

    .spinner-border.custom-size {
      width: 4rem;
      height: 4rem;
      border-width: 0.35em;
      color: #6366f1;
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="page-wrapper">
      <div class="loading-container">
        <div class="loading-text">Loading Virtual Trading Playground...</div>
        <div class="spinner-border custom-size" role="status">
          <span class="sr-only"></span>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
  crossorigin="anonymous"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://kit.fontawesome.com/0aac1c93e2.js" crossorigin="anonymous"></script>
</body>

</html>
